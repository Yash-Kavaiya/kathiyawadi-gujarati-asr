[project]
name = "kgasr"
version = "0.1.0"
description = "Kathiyawadi / Gujarati speech recognition: data pipeline, training and evaluation"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
# Cloud GPU box only. Kept separate so the core library and tests run anywhere.
pipeline = ["yt-dlp", "silero-vad", "torch", "torchaudio", "soundfile", "demucs", "tqdm"]
train = ["torch", "torchaudio", "transformers>=4.45", "datasets>=3.0", "accelerate", "evaluate", "soundfile", "pyyaml"]
nemo = ["nemo_toolkit[asr]"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["kgasr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
